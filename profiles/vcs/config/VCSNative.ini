; VCSNative default DirectX 12 performance configuration.
; Uses the cross-unit AOT hot-register cache, native indexed/strip submission,
; packed 0x0115 GPU decode, hardware culling and batch merging.  GE async
; overlap remains an explicit opt-in until a complete post-intro route is
; validated; the normal launcher is the stable synchronous path.
[Display]
Enabled=true
; Output resolution mode: PSP | Desktop | Custom
;   PSP     = 480x272 logical output
;   Desktop = current Windows desktop/monitor resolution
;   Custom  = uses Width and Height below
ResolutionMode=Desktop
; Used by ResolutionMode=Custom. Valid ranges: Width 320-16384, Height 180-16384.
Width=1920
Height=1080
; Fullscreen=true uses a borderless desktop-sized window. In that mode Width/Height
; still define the Custom logical output size, but the window itself fills the desktop.
Fullscreen=true
AspectRatio=Stretch
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=true
; Espera o vblank do monitor ao apresentar (sem tearing).
VSync=true

[Rendering]
Backend=DirectX12
HardwareTransform=true
DX12GEColor=true
TextureCacheEntries=32768
TextureCacheMB=2048
; Internal render resolution mode: PSP | Scale | Desktop | Custom
;   PSP     = native 480x272 rendering
;   Scale   = 480x272 multiplied by InternalScale (1-8)
;   Desktop = current Windows desktop/monitor resolution
;   Custom  = uses InternalWidth and InternalHeight below
InternalResolutionMode=Custom
; Used only by InternalResolutionMode=Scale.
InternalScale=2
; Used only by InternalResolutionMode=Custom.
; Valid ranges: InternalWidth 480-16384, InternalHeight 272-16384.
InternalWidth=3840
InternalHeight=2160
MSAA=1
SMAA=false
AnisotropicFiltering=16
DepthPrecision=24
ExperimentalGpuColorPreview=false
GeometryDebugColors=false
DumpGpuFrameVblank=0

[Timing]
FrameRate=30
RealtimeSpeedDiagnostics=false
RealtimeSpeedIntervalVblanks=240

[Audio]
Enabled=true
Volume=100
Diagnostics=true
PrebufferBlocks=8
RecoveryPrebufferBlocks=14

[Widescreen]
Enabled=true
AspectRatio=auto

[Project2DFX]
Enabled=true
PerformanceLog=false

[DrawDistance]
; 1.0 = original PSP distance. Objects affects world model-info + far clip;
; Vehicles/NPCs patch the exact generated guest culling constants as well.
Enabled=true
Objects=1.75
Vehicles=2.00
NPCs=2.00

[Frontend]
; V9 load-only startup: the removed BootToGameMenu path can no longer be
; enabled. After the intro, the first AUTOLOAD/LOAD is presented as the
; in-frame PSP Load Game slot picker instead.
; false = keyboard/gamepad only; no desktop cursor or mouse clicks in savedata.
MouseMenu=false

[Textures]
; Texture replacement matched by the texture's internal name inside the game's
; TEX containers -- the same name VCS IMG Studio shows. Nothing is matched by
; VRAM address, so installing a mod that rebuilds the archives does not
; invalidate your files: the names are re-read from whatever is installed.
;
; Use .dds exported as UNCOMPRESSED A8R8G8B8. That is lossless with a full
; 8-bit alpha channel, which is what interface art needs -- DXT quantizes in 4x4
; blocks and ruins sharp edges, and DXT1 carries only one bit of alpha. Nothing
; is gained by compressing: every override is decoded to RGBA8 before upload.
;
; .png is read too, but only if the ffmpeg in this build has a PNG decoder, and
; the one shipped here does not (it is a minimal build for the PMF movies). A
; .png override is skipped with a line in the log saying so.
Enabled=false
; Relative to the executable directory. Subfolders are scanned as well and are
; only for organisation: <dir>/UI/HUD/radar.png and <dir>/radar.png both replace
; the texture named "radar".
Directory=TexturesDDS

[Controls]
CameraStick=true
MouseSensitivity=48
InvertCameraY=false
PedCameraUpLimitDegrees=10
ModernControlScheme=false

[Testing]
; INTERNAL DEVELOPER TOOL ONLY. This is not a general gameplay save-state.
; false = F8/F10 checkpoint/trace hotkeys are completely disabled in normal play.
; true  = F8 captures SAVE_REPRO checkpoint and F10 dumps its diagnostic trace.
; RESTORE_SAVE_REPRO.bat explicitly enables this harness only for its own run.
SaveRepro=false

[Diagnostics]
LogToFile=true
LogFile=VCSNative.log
FlushEveryLine=false

; Texturas do HUD/interface 2D (relogio, dinheiro, barras, icone da arma, radar,
; fontes, menus). Somente no backend DirectX12.
[HudTextures]
; Off    = arte original do PSP, como antes
; Smooth = ampliacao Catmull-Rom + correcao de borda escura + mipmaps
; Sharp  = Smooth + bordas nitidas em letras/contornos (recomendado)
Filter=Sharp
; Ampliacao maxima (2-4). Tambem limitada pela resolucao interna e a 1024 px por lado.
MaxScale=4
; Dump=true grava cada textura 2D uma vez em <Directory>\dump\<hash>.dds
Dump=false
; Replace=true usa <Directory>\<hash>.dds (qualquer subpasta, exceto dump) no lugar
; da textura do jogo. Mesma proporcao do original; DDS 32 bits sem compressao.
Replace=false
Directory=TexturesHD
